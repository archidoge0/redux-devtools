# Researcher-adapted full CI of reduxjs/redux-devtools#1046.
name: GHAV redux-devtools 1046 repair v2
on:
  push:
    branches:
      - 'codex/ghav-redux-v2-*'
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0576588a1adda2a20184c138558dbca2af9b3c7a
          persist-credentials: false
      - name: Verify pinned source and record runner
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "0576588a1adda2a20184c138558dbca2af9b3c7a"
          echo "GHAV_SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "GHAV_IMAGE_VERSION=$ImageVersion"
          echo "GHAV_ORIGINAL_LOCK_SHA256=$(sha256sum yarn.lock | cut -d' ' -f1)"
      - name: Setup historical Node for every arm
        id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 16.20.2
          package-manager-cache: false
          cache: yarn
      - name: Record setup-node cache identity
        shell: bash
        run: |
          echo "GHAV_CACHE_PRIMARY_KEY=${{ steps.setup_node.outputs['cache-primary-key'] }}"
          echo "GHAV_CACHE_MATCHED_KEY=${{ steps.setup_node.outputs['cache-matched-key'] }}"
          echo "GHAV_CACHE_HIT=${{ steps.setup_node.outputs['cache-hit'] }}"
      - name: Prepare fixed Yarn Git compatibility environment
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ghav-bin"
          cat > "$RUNNER_TEMP/ghav-bin/git" <<'GHAV_PY'
          #!/usr/bin/env python3
          import os
          import sys
          
          args = sys.argv[1:]
          if "clone" in args and "-c core.autocrlf=false" in args:
              expanded = []
              for arg in args:
                  if arg == "-c core.autocrlf=false":
                      expanded.extend(("-c", "core.autocrlf=false"))
                  else:
                      expanded.append(arg)
              args = expanded
              print("GHAV_GIT_ARG_ADAPTER: split Yarn clone config argument", file=sys.stderr)
          os.execv("/usr/bin/git", ["/usr/bin/git", *args])
          GHAV_PY
          chmod +x "$RUNNER_TEMP/ghav-bin/git"
          echo "$RUNNER_TEMP/ghav-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/ghav-bin:$PATH"
          git init -q "$RUNNER_TEMP/ghav-git-fixture"
          git clone "-c core.autocrlf=false" "$RUNNER_TEMP/ghav-git-fixture" "$RUNNER_TEMP/ghav-git-clone"
      - name: Install complete historical dependencies with common checksum repair
        env:
          YARN_CHECKSUM_BEHAVIOR: update
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: yarn install
      - name: Record prepared dependency state
        if: always()
        shell: bash
        run: |
          echo "GHAV_SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "GHAV_PREPARED_LOCK_SHA256=$(sha256sum yarn.lock | cut -d' ' -f1)"
          git diff --numstat -- yarn.lock
      - name: Check formatting
        run: yarn format:check
      - name: Build all packages
        run: yarn build:all
      - name: Lint all packages
        run: yarn lint:all
      - name: Test all packages under Xvfb
        uses: GabrielBB/xvfb-action@b706e4e27b14669b486812790492dc50ca16b465
        with:
          run: yarn test:all
