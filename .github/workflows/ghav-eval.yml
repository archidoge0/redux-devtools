# GHAV experiment derived from reduxjs/redux-devtools#1046 CI.yml.
name: GHAV redux-devtools 1046
on:
  push:
    branches:
      - 'codex/ghav-redux-*'
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup historical Node for every arm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 16.20.2
          package-manager-cache: false
      - run: yarn install
      - run: yarn format:check
      - run: yarn build:all
      - run: yarn lint:all
      - name: Run yarn test:all
        uses: GabrielBB/xvfb-action@b706e4e27b14669b486812790492dc50ca16b465
        with:
          run: yarn test:all
